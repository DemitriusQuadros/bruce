basePath: /
definitions:
  handlers.configEntry:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  handlers.connectorResponse:
    properties:
      enabled:
        type: boolean
      status:
        description: '"connected" | "disconnected" | "needs_qr" | "disabled"'
        type: string
      type:
        type: string
    type: object
  handlers.healthResponse:
    properties:
      status:
        type: string
      uptime_seconds:
        type: integer
    type: object
  handlers.messageResponse:
    properties:
      content:
        type: string
      id:
        type: string
      role:
        type: string
      session_id:
        type: string
      timestamp:
        type: string
    type: object
  handlers.providerInfo:
    properties:
      available:
        type: boolean
      model:
        type: string
      name:
        type: string
    type: object
  handlers.sessionResponse:
    properties:
      channel_id:
        type: string
      connector_type:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      provider_override:
        type: string
      system_prompt:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Personal AI assistant — REST API
  title: Bruce API
  version: "1.0"
paths:
  /api/v1/config:
    get:
      description: Returns or updates the runtime configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.configEntry'
            type: array
      summary: Get / update runtime config
      tags:
      - config
    put:
      description: Returns or updates the runtime configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.configEntry'
            type: array
      summary: Get / update runtime config
      tags:
      - config
  /api/v1/connectors:
    get:
      description: Returns the status of all connectors (WhatsApp, Discord)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.connectorResponse'
            type: array
      summary: Get connector status
      tags:
      - connectors
  /api/v1/providers:
    get:
      description: Returns a list of LLM providers and their availability
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.providerInfo'
            type: array
      summary: List available LLM providers
      tags:
      - providers
  /api/v1/sessions:
    get:
      description: Create, list, retrieve, update, and delete chat sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.sessionResponse'
            type: array
      summary: Manage sessions
      tags:
      - sessions
  /api/v1/sessions/{id}:
    get:
      description: Create, list, retrieve, update, and delete chat sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.sessionResponse'
            type: array
      summary: Manage sessions
      tags:
      - sessions
    patch:
      description: Create, list, retrieve, update, and delete chat sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.sessionResponse'
            type: array
      summary: Manage sessions
      tags:
      - sessions
  /api/v1/sessions/{id}/messages:
    get:
      description: List messages within a session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.messageResponse'
            type: array
      summary: Session messages
      tags:
      - messages
  /health:
    get:
      description: Returns server status and uptime
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.healthResponse'
      summary: Health check
      tags:
      - system
swagger: "2.0"
