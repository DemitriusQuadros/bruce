site_name: Bruce
site_description: "A self-hosted, autonomous personal AI assistant that lives in your messaging apps."
site_author: "Demitrius Quadros"
site_url: "https://demitriusquadros.github.io/bruce/"
repo_url: "https://github.com/DemitriusQuadros/bruce"
repo_name: "DemitriusQuadros/bruce"
edit_uri: "edit/master/docs/"

docs_dir: "docs"
site_dir: "site"

theme:
  name: material
  logo: assets/bruce-logo.png
  favicon: assets/bruce-logo.png
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Overview: Visão Geral
            Architecture: Arquitetura
            System Overview: Visão Geral do Sistema
            Autonomous Agent Loop: Loop do Agente Autônomo
            Memory & Context: Memória & Contexto
            Features: Recursos
            Scheduler & Proactive Tasks: Agendador & Tarefas Proativas
            Standalone HTML Artifacts: Artefatos HTML Autônomos
            Multi-Provider LLM Engine: Motor LLM Multi-Provedor
            Omnichannel Connectors: Conectores Omnichannel
            Web Dashboard & REST API: Painel Web & API REST
            Installation & Deployment: Instalação & Deploy
            Docker Compose: Docker Compose
            Bare-Metal Local Dev: Dev Local Bare-Metal
            Homelab & Production: Homelab & Produção
            Tools Reference: Referência de Ferramentas
        - locale: es
          name: Español
          build: true
          nav_translations:
            Overview: Visión General
            Architecture: Arquitectura
            System Overview: Visión General del Sistema
            Autonomous Agent Loop: Bucle del Agente Autónomo
            Memory & Context: Memoria y Contexto
            Features: Características
            Scheduler & Proactive Tasks: Programador y Tareas Proactivas
            Standalone HTML Artifacts: Artefactos HTML Autónomos
            Multi-Provider LLM Engine: Motor LLM Multiproveedor
            Omnichannel Connectors: Conectores Omnicanal
            Web Dashboard & REST API: Panel Web y API REST
            Installation & Deployment: Instalación y Despliegue
            Docker Compose: Docker Compose
            Bare-Metal Local Dev: Dev Local Bare-Metal
            Homelab & Production: Homelab y Producción
            Tools Reference: Referencia de Herramientas

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Overview: README.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Autonomous Agent Loop: architecture/agent-loop.md
      - Memory & Context: architecture/memory-and-context.md
  - Features:
      - Scheduler & Proactive Tasks: features/scheduler-and-proactive.md
      - Standalone HTML Artifacts: features/artifacts.md
      - Multi-Provider LLM Engine: features/llm-providers.md
      - Omnichannel Connectors: features/connectors.md
      - Web Dashboard & REST API: features/dashboard-and-api.md
  - Installation & Deployment:
      - Docker Compose: guides/installation-docker.md
      - Bare-Metal Local Dev: guides/installation-local.md
      - Homelab & Production: guides/deployment-homelab.md
  - Tools Reference: tools/reference.md
