<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bruce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <header>
        <div class="logo">
            <img src="bruce-logo.png" alt="Bruce Logo" class="logo-image" />
        </div>
        <nav>
            <button class="tab-button" data-tab="chat">Chat</button>
            <button class="tab-button" data-tab="connectors">Connectors</button>
            <button class="tab-button" data-tab="sessions">Sessions</button>
            <button class="tab-button" data-tab="logs">Logs</button>
            <button class="tab-button" data-tab="settings">Settings</button>
        </nav>
    </header>

    <main>
        <!-- Tab: Chat -->
        <section id="tab-chat" class="tab-section" hidden>
            <div class="chat-layout">
                <aside class="chat-sidebar">
                    <div class="chat-sidebar-header">
                        <h3>Conversations</h3>
                        <button id="chat-new-btn" class="btn-primary btn-sm">
                            <i class="fas fa-plus"></i> New
                        </button>
                    </div>
                    <div id="chat-session-list" class="chat-session-list"></div>
                </aside>
                <div class="chat-main">
                    <div class="chat-main-header" id="chat-main-header" hidden>
                        <div class="chat-header-info">
                            <h3 id="chat-title">New Conversation</h3>
                            <span id="chat-provider-badge" class="badge badge--accent" hidden></span>
                        </div>
                        <button id="chat-delete-btn" class="btn-danger btn-sm" title="Delete conversation">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <div id="chat-messages" class="chat-messages">
                        <div class="chat-empty-state">
                            <i class="fas fa-comments"></i>
                            <p>Select a conversation or start a new one</p>
                        </div>
                    </div>
                    <div id="chat-input-area" class="chat-input-area" hidden>
                        <textarea id="chat-input" class="chat-input" placeholder="Type a message..." rows="1"></textarea>
                        <button id="chat-send-btn" class="btn-primary chat-send-btn" title="Send message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tab: Connectors -->
        <section id="tab-connectors" class="tab-section">
            <h2>Connectors</h2>
            <div id="connectors-list"></div>
        </section>

        <!-- Tab: Sessions -->
        <section id="tab-sessions" class="tab-section" hidden>
            <h2>Sessions</h2>
            <div class="sessions-container">
                <div id="sessions-list"></div>
                <aside id="session-detail" hidden>
                    <h3>Session Detail</h3>
                    <div class="form-group">
                        <label>System Prompt</label>
                        <textarea id="session-prompt" rows="6"></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="session-active" />
                            Active
                        </label>
                    </div>
                    <button id="session-save" class="btn-primary">Save</button>
                </aside>
            </div>
        </section>

        <!-- Tab: Logs -->
        <section id="tab-logs" class="tab-section" hidden>
            <h2>Logs</h2>
            <div class="logs-controls">
                <select id="logs-session-select"></select>
                <button id="logs-refresh" class="btn-secondary">Refresh</button>
            </div>
            <div id="logs-messages"></div>
        </section>

        <!-- Tab: Settings -->
        <section id="tab-settings" class="tab-section" hidden>
            <h2>Settings</h2>
            <form id="settings-form">
                <h3>Anthropic</h3>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" name="claude.api_key" />
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select name="claude.model">
                        <option>claude-opus-4-6</option>
                        <option>claude-sonnet-4-6</option>
                        <option>claude-haiku-4-5-20251001</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Tokens</label>
                    <input type="number" name="claude.max_tokens" />
                </div>
                <div class="form-group">
                    <label>Context Window</label>
                    <input type="number" name="claude.context_window" />
                </div>
                <h3>Gemini</h3>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" name="gemini.api_key" />
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select name="gemini.model">
                        <option>gemini-2.0-flash</option>
                        <option>gemini-2.5-pro-preview-06-05</option>
                        <option>gemini-2.5-flash-preview-05-20</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Tokens</label>
                    <input type="number" name="gemini.max_tokens" />
                </div>

                <h3>OpenAI</h3>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" name="openai.api_key" />
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select name="openai.model">
                        <option>gpt-4o</option>
                        <option>gpt-4o-mini</option>
                        <option>gpt-4-turbo</option>
                        <option>o1</option>
                        <option>o3-mini</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Max Tokens</label>
                    <input type="number" name="openai.max_tokens" />
                </div>

                <h3>General</h3>
                <div class="form-group">
                    <label>Default System Prompt</label>
                    <textarea name="ui.default_system_prompt" rows="6"></textarea>
                </div>
                <button type="submit" class="btn-primary">Save Settings</button>
            </form>
        </section>
    </main>

    <div id="toast-container"></div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
