server:
  port: 8080

redis:
  address: "localhost:6379"
  max_retries: 3

sqlite:
  dsn: "./data/bruce.db"

claude:
  api_key: ""
  model: "claude-opus-4-6"
  max_tokens: 1024
  context_window: 15

gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  max_tokens: 1024

llm:
  provider: "claude"

connectors:
  whatsapp:
    enabled: false
    device_store_dsn: "./data/whatsapp.db"
  discord:
    enabled: false
    bot_token: ""

ui:
  default_system_prompt: "You are Bruce, a personal AI assistant."
