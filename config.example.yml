server:
  port: 8080

redis:
  address: "localhost:6379"
  max_retries: 3

sqlite:
  dsn: "./data/bruce.db"

claude:
  api_key: ""
  model: "claude-opus-4-6"
  max_tokens: 1024
  context_window: 15

gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  max_tokens: 1024

openai:
  api_key: ""
  model: "gpt-4o"
  max_tokens: 1024

llm:
  provider: "claude"

connectors:
  whatsapp:
    enabled: false
    device_store_dsn: "./data/whatsapp.db"
  discord:
    enabled: false
    bot_token: ""

google:
  # OAuth 2.0 credentials from https://console.cloud.google.com/
  # Create a "Web application" credential, set redirect URI to:
  #   http://localhost:8080/auth/google/callback
  oauth_client_id: ""
  oauth_client_secret: ""
  oauth_redirect_uri: "http://localhost:8080/auth/google/callback"

ui:
  default_system_prompt: "You are Bruce, a personal AI assistant."

tools:
  bash:
    enabled: false
    # If empty, all commands allowed (except blocklist). If non-empty, only these binaries allowed.
    allowed_commands: []
    # Base directory for relative working_dir paths
    working_dir: "/tmp/bruce"
    # Truncate combined stdout+stderr at this size (bytes)
    max_output_bytes: 65536
    # Default command timeout in seconds (capped at 60s hard max)
    timeout_seconds: 30
